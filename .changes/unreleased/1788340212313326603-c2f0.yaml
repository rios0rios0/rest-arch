kind: 'Security'
body: 'upgraded Spring Boot from `3.5.14` to `4.1.1`, which is what reaches Spring Framework `7.0.9`. `spring-core` `6.2.19` is affected by CVE-2026-47890, CVE-2026-47891, CVE-2026-47892, CVE-2026-47893, CVE-2026-59282 and CVE-2026-59283 (four of them 9.8), every one of which is fixed only in `6.2.20` or `7.0.9` -- and `6.2.20` was never published, so the `6.2` line has no remedy at all. Boot `4.1.1` manages `7.0.9`, so the framework override is gone rather than raised. The jump carries Jackson 3: `jackson-databind` and `jackson-core` moved to the `tools.jackson.core` group while `jackson-annotations` kept its coordinates, and `RestService` moved with them -- its `readValue` no longer declares a checked exception, so the `IOException` catch went and `JsonParseException` became the unchecked `JacksonException`. `tomcat` stays overridden at `11.0.25`: Boot `4.1.1` manages `11.0.24`, which still carries CVE-2026-66299 and two others. `log4j2` stays at `2.26.1` over Boot''s `2.25.5`, and `logback` at `1.6.3` over Boot''s `1.5.38`, both being the newest stable.'
time: '2026-09-02T09:10:12.313326603Z'
