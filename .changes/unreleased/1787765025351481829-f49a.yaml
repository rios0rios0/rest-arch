kind: 'Security'
body: 'bumped Apache HttpComponents Client to 5.6.4 and Tomcat to 11.0.25, clearing the three CVEs that had been failing the `main` pipeline''s `sca:dependency-check` job. CVE-2026-71290 (9.1) is the one that mattered here: `HostnameVerificationPolicy#BUILTIN` has no effect on the *async* HttpClient, so anyone able to intercept the connection could impersonate the server by presenting a valid certificate issued for some other domain — and consuming REST APIs over that client is the whole point of this library. Alongside it, CVE-2026-64607 (5.3) leaks the connection whenever a `Content-Encoding` body fails to decode, exhausting the pool over time, and CVE-2026-66299 (7.5) is uncontrolled resource consumption in Tomcat''s WebSocket *example* webapp, which this library never ships — it is flagged because the scanner matches the Tomcat CPE, not the shipped classes. Only those four artifacts changed version; the resolved dependency set is otherwise byte-identical, so the bump dragged in no new transitive dependency of its own.'
